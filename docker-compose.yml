# 生产/部署用的 compose：直接拉取预构建镜像（由 GitHub Actions 构建并推送到 GHCR）
# 镜像地址：ghcr.io/qingdeng888/chatgpt2api:20260825
# 本地从源码构建请改用：docker compose -f docker-compose.local.yml up --build
services:
  app:
    image: ghcr.io/qingdeng888/chatgpt2api:20260825
    container_name: chatgpt2api
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    # 使用 .env 文件注入环境变量（含 CHATGPT2API_AUTH_KEY，覆盖 config.json 的 auth-key）
    env_file:
      - .env
    environment:
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      - STORAGE_BACKEND=json

      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # - DATABASE_URL=sqlite:///app/data/accounts.db

      # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
      # - GIT_REPO_URL=https://github.com/user/repo.git
      # - GIT_TOKEN=ghp_xxxxxxxxxxxx
      # - GIT_BRANCH=main
      # - GIT_FILE_PATH=accounts.json

      # 认证密钥 (可选，覆盖 config.json)
      # - CHATGPT2API_AUTH_KEY=your_secret_key

      # 基础 URL (可选)
      # - CHATGPT2API_BASE_URL=https://your-domain.com
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:80/version', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # FlareSolverr - Cloudflare 过盾服务（可选）
  # 启用后在注册机配置中填写 flaresolverr_url: http://flaresolverr:8191
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - LOG_HTML=${FLARESOLVERR_LOG_HTML:-false}
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER:-none}
      - TZ=Asia/Shanghai
    profiles:
      - flaresolverr
